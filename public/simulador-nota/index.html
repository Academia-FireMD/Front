\"w560\"\u003e · Comunidad de Madrid\u003c/span\u003e\u003c/div\u003e \u003ch2 class=\"phead__h2\"\u003ePrimer ejercicio: test\u003c/h2\u003e \u003cp class=\"phead__p\"\u003eUn único test de 180 preguntas (psicotécnicas y de temario) calificado de 0 a 20, con un mínimo de 10. Las pruebas de tolerancia y el reconocimiento médico no puntúan, pero son eliminatorios.\u003c/p\u003e \u003c/div\u003e \u003c/div\u003e \u003cdiv class=\"lookup only-ayto\" data-el=\"alumno\"\u003e \u003cdiv class=\"lookup__t\"\u003e\u003cspan data-ico=\"bandera\"\u003e\u003c/span\u003e\u003cdiv\u003e\u003cb\u003e¿Te presentaste a la convocatoria de 2024 del Ayuntamiento de Valencia?\u003c/b\u003e\u003cspan\u003eEscribe tu nombre o tus apellidos, elígete en la lista y cargamos las calificaciones que el OTS ha publicado: test y las seis pruebas físicas (natación, 60 m, press de banca, cuerda, torre y 3.000 m). Lo que escribes no se envía ni se guarda.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e \u003cform class=\"lookup__f\" data-el=\"alumno-form\" novalidate\u003e \u003cdiv class=\"lookup__box\"\u003e \u003clabel class=\"sr\" for=\"tkf-alumno\"\u003eNombre o apellidos\u003c/label\u003e \u003cinput class=\"input input--txt\" id=\"tkf-alumno\" type=\"text\" autocomplete=\"off\" autocapitalize=\"words\" spellcheck=\"false\" placeholder=\"Nombre o apellidos\" role=\"combobox\" aria-autocomplete=\"list\" aria-expanded=\"false\" aria-controls=\"tkf-alumno-lista\" data-el=\"alumno-in\"\u003e \u003c/div\u003e \u003cbutton type=\"submit\" class=\"btn btn--primary\"\u003eBuscar\u003c/button\u003e \u003c/form\u003e \u003cul class=\"lookup__list\" id=\"tkf-alumno-lista\" role=\"listbox\" aria-label=\"Aspirantes que coinciden\" data-el=\"alumno-lista\" hidden\u003e\u003c/ul\u003e \u003cp class=\"lookup__msg\" data-el=\"alumno-msg\" hidden role=\"status\"\u003e\u003c/p\u003e \u003c/div\u003e \u003cdiv class=\"grid grid--2\"\u003e \u003cdiv class=\"col\"\u003e \u003carticle class=\"card\" data-el=\"card-test\"\u003e\u003c/article\u003e \u003c/div\u003e \u003cdiv class=\"col\"\u003e \u003carticle class=\"card only-cv\" data-el=\"card-supuesto\"\u003e\u003c/article\u003e \u003carticle class=\"card\"\u003e \u003cdiv class=\"card__head\"\u003e \u003cdiv class=\"card__id\"\u003e \u003cdiv class=\"card__ico\" data-ico=\"escudo\"\u003e\u003c/div\u003e \u003cdiv\u003e \u003ch3 class=\"card__title\"\u003ePruebas de apto / no apto\u003c/h3\u003e \u003cdiv class=\"card__sub\"\u003eNo suman puntos, pero un «no apto» te deja fuera del proceso.\u003c/div\u003e \u003c/div\u003e \u003c/div\u003e \u003c/div\u003e \u003cdiv class=\"aptos\" data-el=\"aptos\"\u003e\u003c/div\u003e \u003c/article\u003e \u003c/div\u003e \u003c/div\u003e \u003cdiv class=\"next\"\u003e\u003cspan\u003e\u003c/span\u003e\u003cbutton type=\"button\" class=\"btn btn--dark\" data-go=\"fisicas\"\u003eSiguiente: pruebas físicas \u003cspan data-ico=\"flecha\"\u003e\u003c/span\u003e\u003c/button\u003e\u003c/div\u003e \u003c/section\u003e \u003csection class=\"panel\" data-panel=\"fisicas\" role=\"tabpanel\" aria-labelledby=\"tkf-tab-fisicas\" hidden\u003e \u003cdiv class=\"phead\"\u003e \u003cdiv class=\"only-cv\"\u003e \u003cdiv class=\"phead__kicker\"\u003eFase de oposición\u003cspan class=\"w560\"\u003e · Comunitat Valenciana\u003c/span\u003e\u003c/div\u003e \u003ch2 class=\"phead__h2\"\u003ePruebas físicas\u003c/h2\u003e \u003cp class=\"phead__p\"\u003eEscribe tu marca o arrastra el marcador sobre el baremo. Cada prueba puntúa de 5 a 10; fuera del baremo es «no apto» y elimina. La nota del ejercicio es la media de las pruebas.\u003c/p\u003e \u003c/div\u003e \u003cdiv class=\"only-madrid\"\u003e \u003cdiv class=\"phead__kicker\"\u003eSegundo ejercicio\u003cspan class=\"w560\"\u003e · Comunidad de Madrid\u003c/span\u003e\u003c/div\u003e \u003ch2 class=\"phead__h2\"\u003ePruebas físicas\u003c/h2\u003e \u003cp class=\"phead__p\"\u003eSeis pruebas con baremo continuo: la marca mínima vale 1,5 puntos (2 en mujeres) e\u003c/span\u003e Pruebas físicas\u003c/button\u003e \u003cbutton type=\"button\" class=\"btn btn--primary\" data-go=\"resultado\"\u003eVer resultado \u003cspan data-ico=\"flecha\"\u003e\u003c/span\u003e\u003c/button\u003e \u003c/div\u003e \u003c/section\u003e \u003csection class=\"panel\" data-panel=\"resultado\" role=\"tabpanel\" aria-labelledby=\"tkf-tab-resultado\" hidden\u003e \u003cdiv class=\"phead\"\u003e \u003cdiv\u003e \u003cdiv class=\"phead__kicker\"\u003eAnálisis\u003c/div\u003e \u003ch2 class=\"phead__h2\"\u003eResultado y comparativa\u003c/h2\u003e \u003cp class=\"phead__p\"\u003eTu nota desglosada, lo que te separa de tu objetivo, dónde puedes ganar puntos y la comparación entre simulaciones.\u003c/p\u003e \u003c/div\u003e \u003cdiv class=\"phead__aside\"\u003e\u003cspan data-el=\"estado-res\"\u003e\u003c/span\u003e\u003c/div\u003e \u003c/div\u003e \u003cdiv class=\"grid grid--res\"\u003e \u003cdiv class=\"col\"\u003e \u003carticle class=\"card o1\"\u003e \u003cdiv class=\"card__head\"\u003e\u003cdiv\u003e\u003ch3 class=\"card__title\"\u003eDesglose de la nota\u003c/h3\u003e\u003cdiv class=\"card__sub only-concurso\"\u003eOposición (máx. 30) más concurso (máx. 15,60)\u003c/div\u003e\u003cdiv class=\"card__sub only-cv only-sinconcurso\"\u003eOposición (máx. 30): test, supuesto práctico y físicas, sin fase de concurso\u003c/div\u003e\u003cdiv class=\"card__sub only-madrid\"\u003eTest (máx. 20) más pruebas físicas (máx. 30)\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e \u003cdiv class=\"tbl-wrap\"\u003e\u003ctable class=\"tbl\" data-el=\"desglose\"\u003e\u003c/table\u003e\u003c/div\u003e \u003c/article\u003e \u003carticle class=\"card savebar o4\"\u003e \u003cdiv class=\"card__head\"\u003e\u003cdiv\u003e\u003ch3 class=\"card__title\"\u003eGuardar y compartir\u003c/h3\u003e\u003cdiv class=\"card__sub\"\u003eLas simulaciones se guardan en este navegador. El código permite enviarlas a tu preparador o a un compañero.\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e \u003cdiv class=\"savebar__row\"\u003e \u003cdiv class=\"field\"\u003e \u003clabel class=\"field__label\" for=\"tkf-nombre\"\u003eNombre de la simulación\u003c/label\u003e \u003cinput class=\"input input--txt\" id=\"tkf-nombre\" type=\"text\" maxlength=\"60\" autocomplete=\"off\" placeholder=\"Ej.: Marcas de septiembre\"\u003e \u003c/div\u003e \u003cbutton type=\"button\" class=\"btn btn--primary\" data-act=\"guardar\"\u003e\u003cspan data-ico=\"guardar\"\u003e\u003c/span\u003e Guardar simulación\u003c/button\u003e \u003c/div\u003e \u003cdiv class=\"btns btns--fill\"\u003e \u003cbutton type=\"button\" class=\"btn\" data-act=\"informe\"\u003e\u003cspan data-ico=\"imprimir\"\u003e\u003c/span\u003e Informe en PDF\u003c/button\u003e \u003cbutton type=\"button\" class=\"btn\" data-act=\"copiar\"\u003e\u003cspan data-ico=\"copiar\"\u003e\u003c/span\u003e Copiar resumen y código\u003c/button\u003e \u003cbutton type=\"button\" class=\"btn btn--ghost\" data-act=\"reiniciar\"\u003e\u003cspan data-ico=\"reiniciar\"\u003e\u003c/span\u003e Empezar de cero\u003c/button\u003e \u003c/div\u003e \u003cp class=\"card__foot savebar__mail\" data-el=\"correo-info\"\u003e\u003c/p\u003e \u003c/article\u003e \u003c/div\u003e \u003cdiv class=\"col\"\u003e \u003carticle class=\"card goal o2\"\u003e \u003cdiv class=\"card__head\"\u003e\u003cdiv\u003e\u003ch3 class=\"card__title\"\u003eTu objetivo\u003c/h3\u003e\u003cdiv class=\"card__sub\"\u003ePor ejemplo, la nota de corte de la última convocatoria\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e \u003cdiv class=\"goal__top\"\u003e \u003cdiv data-el=\"objetivo-campo\" style=\"width: 150px\"\u003e\u003c/div\u003e \u003cp class=\"goal__msg\" data-el=\"objetivo-msg\"\u003e\u003c/p\u003e \u003c/div\u003e \u003cdiv class=\"line\" data-el=\"linea\"\u003e \u003cdiv class=\"line__fill\" data-el=\"linea-fill\"\u003e\u003c/div\u003e \u003cdiv class=\"line__goal\" data-el=\"linea-goal\" hidden\u003e\u003cspan data-el=\"linea-goal-txt\"\u003e\u003c/span\u003e\u003c/div\u003e \u003cdiv class=\"line__ends\"\u003e\u003cspan\u003e0\u003c/span\u003e\u003cspan data-el=\"linea-max\"\u003e45,60\u003c/span\u003e\u003c/div\u003e \u003c/div\u003e \u003c/article\u003e \u003carticle class=\"card o3\"\u003e \u003cdiv class=\"card__head\"\u003e\u003cdiv\u003e\u003ch3 class=\"card__title\"\u003eDónde ganar puntos\u003c/h3\u003e\u003cdiv class=\"card__sub\"\u003eSiguiente escalón de cada apartado y lo que suma a tu nota final\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e \u003cdiv class=\"levers\" data-el=\"palancas\"\u003e\u003c/div\u003e \u003cp class=\"card__foot\" data-el=\"palancas-pie\"\u003e\u003c/p\u003e \u003c/article\u003e \u003c/div\u003e \u003c/div\u003e \u003carticle class=\"card\"\u003e \u003cdiv class=\"card__head\"\u003e \u003cdiv\u003e\u003ch3 class=\"card__title\"\u003eComparativa de simulaciones\u003c/h3\u003e\u003cdiv class=\"card__sub\"\u003eTu simulación actual frente a las guardadas y a las que importes con un código\u003c/div\u003e\u003c/div\u003e \u003c/div\u003e \u003cdiv class=\"stats\" data-el=\"stats\"\u003e\u003c/div\u003e \u003cdiv class=\"legend\" data-el=\"cmp-legend\"\u003e\u003c/div\u003e \u003cdiv class=\"cmp\" data-el=\"cmp\"\u003e\u003c/div\u003e \u003cdetails class=\"more\" data-el=\"importar\"\u003e \u003csummary\u003eImportar simulaciones con código\u003c/summary\u003e \u003cdiv class=\"more__body\"\u003e \u003cp\u003ePega aquí uno o varios códigos (o los mensajes completos que te hayan enviado). Cada código empieza por \u003cb\u003eTKF1.\u003c/b\u003e\u003c/p\u003e \u003clabel class=\"sr\" for=\"tkf-import\"\u003eCódigos de simulación\u003c/label\u003e \u003ctextarea class=\"input\" id=\"tkf-import\" spellcheck=\"false\" placeholder=\"TKF1.…\"\u003e\u003c/textarea\u003e \u003cdiv class=\"btns\"\u003e \u003cbutton type=\"button\" class=\"btn btn--sm btn--dark\" data-act=\"importar\"\u003eAñadir a la comparativa\u003c/button\u003e \u003cbutton type=\"button\" class=\"btn btn--sm\" data-act=\"csv\"\u003e\u003cspan data-ico=\"descargar\"\u003e\u003c/span\u003e Exportar comparativa (CSV)\u003c/button\u003e \u003c/div\u003e \u003c/div\u003e \u003c/details\u003e \u003c/article\u003e \u003cdetails class=\"more only-cv\"\u003e \u003csummary\u003eCriterios de cálculo aplicados (Comunitat Valenciana)\u003c/summary\u003e \u003cdiv class=\"more__body\"\u003e \u003cul\u003e \u003cli\u003e\u003cb\u003eEjercicios puntuables.\u003c/b\u003e Pruebas físicas, test y supuesto práctico se califican de 0 a 10 y quedan eliminadas las personas que no alcancen 5 puntos en cada uno (art. 20.2 del Decreto 163/2019).\u003c/li\u003e \u003cli\u003e\u003cb\u003ePruebas físicas.\u003c/b\u003e Cada prueba puntúa de 5 a 10 según las tablas del Anexo I para bombero/a, distintas para hombres y mujeres. La nota del ejercicio se calcula como la media aritmética de las pruebas: es el criterio habitual de las bases, porque el decreto no fija la fórmula.\u003c/li\u003e \u003cli\u003e\u003cb\u003eSubida de torre.\u003c/b\u003e El decreto deja su baremo a cada servicio (lastre de 15 kg, misma altura y carga para hombres y mujeres, distinto tiempo). Indica los puntos según tus bases o exclúyela si tu convocatoria no la incluye.\u003c/li\u003e \u003cli\u003e\u003cb\u003eTest.\u003c/b\u003e El decreto no fija el número de preguntas ni la penalización: ajústalos a tu convocatoria. Nota = (aciertos − errores × penalización) × 10 / preguntas.\u003c/li\u003e \u003cli\u003e\u003cb\u003ePsicotécnico y reconocimiento médico.\u003c/b\u003e Apto o no apto, eliminatorios (art. 20.7, Anexos VII y VIII).\u003c/li\u003e \u003cli class=\"only-concurso\"\u003e\u003cb\u003eMéritos.\u003c/b\u003e Anexo VI, turno libre, bombero/a: experiencia (máx. 8,60), títulos y formación (máx. 4,50: titulación 2,50 y cursos 2,00), valenciano (máx. 1,50) e idiomas comunitarios (máx. 1,00). Solo se bareman tras superar la oposición (art. 22.1).\u003c/li\u003e \u003cli class=\"only-concurso\"\u003e\u003cb\u003eNota final.\u003c/b\u003e Suma de la fase de oposición (máx. 30) y la de concurso (máx. 15,60). El concurso supone como mucho el 34,2 % del total, dentro del límite del 40 % del art. 22.2.\u003c/li\u003e \u003cli class=\"only-sinconcurso\"\u003e\u003cb\u003eAyuntamiento de Valencia.\u003c/b\u003e Oposición libre sin fase de concurso: la nota final es la suma del test, el supuesto práctico y las pruebas físicas (máx. 30), como en la convocatoria de 2022. Los méritos no cuentan.\u003c/li\u003e \u003c/ul\u003e \u003c/div\u003e \u003c/details\u003e \u003cdetails class=\"more only-madrid\"\u003e \u003csummary\u003eCriterios de cálculo aplicados (Comunidad de Madrid)\u003c/summary\u003e \u003cdiv class=\"more__body\"\u003e \u003cul\u003e \u003cli\u003e\u003cb\u003ePrimer ejercicio: test.\u003c/b\u003e 180 preguntas (40 psicotécnicas y 140 de temario); cada error resta un tercio de acierto. Se califica de 0 a 20 y exige un mínimo de 10 (Órdenes 2780/2023 y 877/2026 de la Consejería de Medio Ambiente, Agricultura e Interior).\u003c/li\u003e \u003cli\u003e\u003cb\u003eSegundo ejercicio: pruebas físicas.\u003c/b\u003e Natación 100 m, cuerda lisa 6 m, press de banca 40 kg, 60 m, 300 m y 2.000 m. Cada prueba puntúa de 1,5 (2 en mujeres) a 5 puntos con un baremo continuo: la marca mínima da la puntuación mínima, la marca tope da 5 y entre ambas la puntuación es proporcional. No alcanzar la marca mínima es «no apto» y elimina. La nota es la suma de las seis pruebas, hasta 30.\u003c/li\u003e \u003cli\u003e\u003cb\u003ePruebas de tolerancia y reconocimiento médico.\u003c/b\u003e Apto o no apto, eliminatorios y sin puntuación.\u003c/li\u003e \u003cli\u003e\u003cb\u003eNota de la oposición.\u003c/b\u003e Test más pruebas físicas, hasta 50. No hay supuesto práctico ni fase de concurso: los méritos no cuentan.\u003c/li\u003e \u003cli\u003e\u003cb\u003eMarcas comunes.\u003c/b\u003e Natación, cuerda y 60 m son las mismas marcas que en el resto de oposiciones: si cambias de ámbito, se conservan.\u003c/li\u003e \u003c/ul\u003e \u003c/div\u003e \u003c/details\u003e \u003c/section\u003e \u003csection class=\"panel\" data-panel=\"oposiciones\" role=\"tabpanel\" aria-labelledby=\"tkf-tab-oposiciones\" hidden\u003e \u003cdiv class=\"phead\"\u003e \u003cdiv\u003e \u003cdiv class=\"phead__kicker\"\u003eResultados reales · datos anónimos\u003c/div\u003e \u003ch2 class=\"phead__h2\"\u003e¿Dónde quedarías en cada oposición?\u003c/h2\u003e \u003cp class=\"phead__p\"\u003eTu simulación, traducida a las reglas de cada convocatoria y situada entre las notas publicadas de sus aspirantes. Solo se usan puntuaciones: ningún nombre.\u003c/p\u003e \u003c/div\u003e \u003c/div\u003e \u003cdiv class=\"convs\" data-el=\"convs\" role=\"tablist\" aria-label=\"Convocatorias\"\u003e\u003c/div\u003e \u003cdiv class=\"grid grid--conv\"\u003e \u003cdiv class=\"col\"\u003e \u003carticle class=\"card\"\u003e \u003cdiv class=\"card__head\"\u003e \u003cdiv class=\"card__id\"\u003e \u003cdiv class=\"card__ico card__ico--conv\" data-ico=\"bandera\"\u003e\u003c/div\u003e \u003cdiv\u003e\u003ch3 class=\"card__title\" data-el=\"conv-titulo\"\u003e—\u003c/h3\u003e\u003cdiv class=\"card__sub\" data-el=\"conv-sub\"\u003e\u003c/div\u003e\u003c/div\u003e \u003c/div\u003e \u003c/div\u003e \u003cdiv class=\"stats stats--conv\" data-el=\"conv-kpi\"\u003e\u003c/div\u003e \u003cdiv class=\"verdict\" data-el=\"conv-veredicto\"\u003e\u003c/div\u003e \u003cfigure class=\"chart\" data-el=\"conv-chart-fig\"\u003e \u003cfigcaption class=\"chart__cap\"\u003e\u003cb data-el=\"conv-chart-tit\"\u003eDistribución de las notas finales\u003c/b\u003e \u003cspan data-el=\"conv-chart-cap\"\u003e\u003c/span\u003e\u003c/figcaption\u003e \u003cdiv class=\"chart__svg\" data-el=\"conv-chart\"\u003e\u003c/div\u003e \u003cdiv class=\"chart__legend\" data-el=\"conv-chart-leg\"\u003e\u003c/div\u003e \u003c/figure\u003e \u003cdiv class=\"plazas\" data-el=\"conv-plazas\"\u003e\u003c/div\u003e \u003c/article\u003e \u003carticle class=\"card\"\u003e \u003cdiv class=\"card__head\"\u003e\u003cdiv\u003e\u003ch3 class=\"card__title\"\u003eEjercicio a ejercicio\u003c/h3\u003e\u003cdiv class=\"card__sub\"\u003eTu nota frente a la media de los aprobados y a la de quienes obtuvieron plaza\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e \u003cdiv class=\"rows\" data-el=\"conv-bloques\"\u003e\u003c/div\u003e \u003c/article\u003e \u003c/div\u003e \u003cdiv class=\"col\"\u003e \u003carticle class=\"card\" data-el=\"conv-madrid\" hidden\u003e \u003cdiv class=\"card__head\"\u003e\u003cdiv\u003e\u003ch3 class=\"card__title\"\u003eTus pruebas físicas en esta convocatoria\u003c/h3\u003e\u003cdiv class=\"card__sub\" data-el=\"conv-madrid-sub\"\u003ePuntos de cada prueba con el baremo de la convocatoria y tus marcas de la pestaña de físicas.\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e \u003cdiv class=\"rows\" data-el=\"conv-madrid-tabla\"\u003e\u003c/div\u003e \u003c/article\u003e \u003carticle class=\"card\" data-el=\"conv-mer\" hidden\u003e \u003cdiv class=\"card__head\"\u003e\u003cdiv\u003e\u003ch3 class=\"card__title\"\u003eMéritos, apartado por apartado\u003c/h3\u003e\u003cdiv class=\"card__sub\" data-el=\"conv-mer-sub\"\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e \u003cdiv class=\"rows\" data-el=\"conv-mer-filas\"\u003e\u003c/div\u003e \u003c/article\u003e \u003carticle class=\"card\" data-el=\"conv-fis\"\u003e \u003cdiv class=\"card__head\"\u003e\u003cdiv\u003e\u003ch3 class=\"card__title\"\u003ePruebas físicas, una a una\u003c/h3\u003e\u003cdiv class=\"card__sub\" data-el=\"conv-fis-sub\"\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e \u003cdiv class=\"rows\" data-el=\"conv-fis-filas\"\u003e\u003c/div\u003e \u003c/article\u003e \u003carticle class=\"card\"\u003e \u003cdiv class=\"card__head\"\u003e\u003cdiv\u003e\u003ch3 class=\"card__title\"\u003eCómo se calcula aquí\u003c/h3\u003e\u003cdiv class=\"card__sub\" data-el=\"conv-fuente\"\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e \u003cul class=\"rules\" data-el=\"conv-reglas\"\u003e\u003c/ul\u003e \u003c/article\u003e \u003c/div\u003e \u003c/div\u003e \u003carticle class=\"card\" data-el=\"ranking-card\" hidden\u003e \u003cdiv class=\"card__head\"\u003e \u003cdiv\u003e\u003ch3 class=\"card__title\"\u003e\u003cspan data-el=\"ranking-tit\"\u003eRanking provisional\u003c/span\u003e · \u003cspan data-el=\"ranking-conv\"\u003e\u003c/span\u003e\u003c/h3\u003e\u003cdiv class=\"card__sub\" data-el=\"ranking-sub\"\u003e\u003c/div\u003e\u003c/div\u003e \u003c/div\u003e \u003cdiv class=\"stats stats--rank\" data-el=\"ranking-kpi\"\u003e\u003c/div\u003e \u003cdiv class=\"rank__insight\" data-el=\"ranking-insight\" hidden\u003e\u003c/div\u003e \u003cdiv class=\"rank__tools\"\u003e \u003clabel class=\"sr\" for=\"tkf-ranking-buscar\"\u003eBuscar en el ranking\u003c/label\u003e \u003cinput class=\"input input--txt\" id=\"tkf-ranking-buscar\" type=\"text\" autocomplete=\"off\" spellcheck=\"false\" placeholder=\"Buscar por nombre o apellidos\" data-el=\"ranking-buscar\"\u003e \u003clabel class=\"sr\" for=\"tkf-ranking-estado\"\u003eEstado\u003c/label\u003e \u003cselect class=\"input input--txt\" id=\"tkf-ranking-estado\" data-el=\"ranking-estado\"\u003e \u003coption value=\"all\"\u003eTodos los estados\u003c/option\u003e \u003coption value=\"rank\"\u003eEn el ranking\u003c/option\u003e \u003coption value=\"conv\"\u003eConvalidados\u003c/option\u003e \u003coption value=\"noapto\"\u003eNo aptos\u003c/option\u003e \u003coption value=\"np\"\u003eNo presentados\u003c/option\u003e \u003c/select\u003e \u003clabel class=\"sr\" for=\"tkf-ranking-tramo\"\u003eTramo\u003c/label\u003e \u003cselect class=\"input input--txt\" id=\"tkf-ranking-tramo\" data-el=\"ranking-tramo\"\u003e \u003coption value=\"all\"\u003eToda la lista\u003c/option\u003e \u003coption value=\"dentro\"\u003eDentro de las plazas\u003c/option\u003e \u003coption value=\"fuera\"\u003eFuera de las plazas\u003c/option\u003e \u003c/select\u003e \u003cbut \u003e\u003c/span\u003e Resultado\u003c/button\u003e \u003cspan\u003e\u003c/span\u003e \u003c/div\u003e \u003c/section\u003e \u003cfooter class=\"foot\"\u003e \u003cp\u003e\u003cb\u003eHerramienta orientativa de TÉCNIKA FIRE.\u003c/b\u003e La calificación oficial corresponde al órgano técnico de selección conforme a las bases de cada convocatoria.\u003c/p\u003e \u003cp class=\"only-cv\"\u003eBaremos: Decreto 163/2019, de 19 de julio, del Consell (DOGV núm. 8602, de 30.07.2019) — categoría bombero/a, turno libre: art. 20 y 22, Anexo I y Anexo VI.\u003c/p\u003e \u003cp class=\"only-madrid\"\u003eBaremos: Órdenes 2780/2023 (BOCM 28.11.2023) y 877/2026 (BOCM 08.04.2026) de la Comunidad de Madrid — bombero/a especialista conductor, turno libre.\u003c/p\u003e \u003cp class=\"only-cv\"\u003eResultados reales: listados oficiales anonimizados del CPBV (2018 y 2023), del CPBA (2020) y del Ayuntamiento de Valencia (2022), solo con puntuaciones; de la convocatoria de 2024 del Ayuntamiento de Valencia (en curso), los anuncios públicos del OTS con los nombres de los aspirantes, usados únicamente para que cada uno cargue sus propias calificaciones.\u003c/p\u003e \u003cp class=\"only-madrid\"\u003eResultados reales: relaciones oficiales anonimizadas de aprobados de Bomberos de la Comunidad de Madrid (2022 y 2023). Solo puntuaciones; ningún dato personal.\u003c/p\u003e \u003c/footer\u003e \u003c/div\u003e \u003cdiv class=\"modal\" data-el=\"modal-correo\" hidden\u003e \u003cdiv class=\"modal__box\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"tkf-correo-h\"\u003e \u003cdiv class=\"modal__head\"\u003e \u003cdiv class=\"card__ico\" data-ico=\"imprimir\"\u003e\u003c/div\u003e \u003cdiv\u003e\u003ch3 class=\"card__title\" id=\"tkf-correo-h\"\u003eTu informe en PDF\u003c/h3\u003e\u003cdiv class=\"card__sub\"\u003eIndica tu correo para generar el informe con tu simulación. Lo usaremos para enviarte información de TÉCNIKA FIRE sobre la preparación de la oposición.\u003c/div\u003e\       }));

        '<div class="hero"><div class="box t"><div class="l">Nota final estimada</div><div class="v">' + pts(r.total) + ' <small>/ ' + (sinCon ? '30' : '45,60') + '</small></div></div>' +
        '<div class="box"><div class="l">Fase de oposición</div><div class="v">' + pts(r.oposicion) + ' <small>/ 30</small></div></div>' +
        (sinCon ? '<div class="box"><div class="l">Fase de concurso</div><div class="v"><small>No hay: los méritos no cuentan</small></div></div></div>' : '<div class="box"><div class="l">Fase de concurso</div><div class="v">' + pts(r.concurso) + ' <small>/ 15,60</small></div></div></div>') +
        '<div class="estado">' + (S.nombre ? esc(S.nombre) + ' · ' : '') + 'Baremo de ' + (S.sexo === 'M' ? 'mujeres' : 'hombres') + ' · ' + esc(textoEstado(r, true)) + (r.objetivo ? ' · Objetivo ' + pts(r.objetivo.valor) + ' (' + (r.objetivo.diferencia >= 0 ? '+' : '−') + pts(Math.abs(r.objetivo.diferencia)) + ')' : '') + '</div>' +
        '<h2>Fase de oposición</h2><table>' + fila('Ejercicio tipo test', esc(dTest), pts(r.bloques.test), '10') + fila('Supuesto práctico', '', pts(r.bloques.supuesto), '10') +
        fila('Pruebas físicas', r.fisicas.directa ? (r.fisicas.apto === false ? 'Nota directa por debajo de 5' : 'Nota escrita directamente') : r.fisicas.apto === false ? 'Hay una prueba no apta' : 'Media de ' + r.fisicas.conMarca + ' pruebas', r.fisicas.apto === false ? 'NO APTO' : pts(r.bloques.fisicas), '10') + fis +
        fila('Psicotécnico / Reconocimiento médico', apt[S.psico] + ' / ' + apt[S.medico], '—', '—', 'in') + fila('Total de la fase de oposición', '', pts(r.oposicion), '30', 'sum') + '</table>' +
        (sinCon ? '<table>' + fila('NOTA FINAL ESTIMADA', 'Oposición libre sin fase de concurso', pts(r.total), '30', 'tot') + '</table>' :
        '<h2>Fase de concurso · méritos (Anexo VI, turno libre)</h2><table>' + fila('1. Experiencia profesional', exp + med('exp'), pts(m.experiencia.total), '8,60') +
        fila('2. Títulos académicos y formación', '', pts(m.formacion.total), '4,50') + fila('Titulación académica', tit + med('tit'), pts(m.titulos.total), '2,50', 'in') + fila('Cursos de formación', cur + med('cur'), pts(m.cursos.total), '2,00', 'in') +
        fila('3. Valenciano', (S.meritos.valenciano || 'Sin certificado') + med('val'), pts(m.valenciano.total), '1,50') + fila('4. Idiomas comunitarios', idi + med('idi'), pts(m.idiomas.total), '1,00') +
        fila('Total de la fase de concurso', rm.total ? '<small>Media de ' + esc(rm.total.conv) + ': ' + fnum(rm.total.media, 2) + (rm.total.max ? ' / ' + fcampo(rm.total.max, 2) : '') + (C.esNum(rm.total.mio) ? ' · tú con el baremo ' + rm.baremo + ': ' + fnum(rm.total.mio, 2) : '') + '</small>' : '', pts(r.concurso), '15,60', 'sum') + fila('NOTA FINAL ESTIMADA', '', pts(r.total), '45,60', 'tot') + '</table>') +
        tablaConvocatoriasInforme() +
        pieInforme('Simulación orientativa elaborada con el simulador de TÉCNIKA FIRE según el Decreto 163/2019, de 19 de julio, del Consell (DOGV núm. 8602, de 30.07.2019). La nota de físicas se calcula como media aritmética de las pruebas; el baremo de la subida de torre y el formato del test dependen de las bases de cada convocatoria. No tiene validez oficial.');
    }
    function htmlInformeMadrid() {
      var r = RM, fila = filaInf, t = r.test;
      var fis = r.fisicas.directa ? fila('Puntos del ejercicio', 'Escritos directamente, sin desglose por prueba', r.fisicas.suma === null ? '—' : pts(r.fisicas.suma), '30', 'in') : r.fisicas.pruebas.map(function (q) {
        return fila(esc(q.nombre) + ' <small>' + esc(q.detalle) + ' · mínima ' + esc(fmarca(q.min, q.formato)) + ', tope ' + esc(fmarca(q.top, q.formato)) + '</small>', q.marca === null ? '—' : esc(fmarca(q.marca, q.formato)), q.puntos === null ? '—' : q.puntos === 0 ? 'NO APTO' : fnum(q.puntos, 2), '5', 'in');
      }).join('');
      var dTest = S.test.modo === 'calc' && t.nota !== null ? ((S.test.aciertos || 0) + ' aciertos, ' + (S.test.errores || 0) + ' errores, ' + t.blancos + ' en blanco de ' + S.test.n + ' (' + PEN_TXT[S.test.pen].toLowerCase() + ')') : 'Nota directa';
      var apt = { pend: 'Pendiente', apto: 'Apto', no: 'NO APTO' };
      return cabeceraInforme(VISTAS.madrid.informe) +
        '<div class="hero"><div class="box t"><div class="l">Nota de la oposición estimada</div><div class="v">' + pts(r.total) + ' <small>/ 50</small></div></div>' +
        '<div class="box"><div class="l">Test</div><div class="v">' + pts(r.bloques.test) + ' <small>/ 20</small></div></div>' +
        '<div class="box"><div class="l">Pruebas físicas</div><div class="v">' + (r.fisicas.apto === false ? 'NO APTO' : pts(r.bloques.fisicas)) + ' <small>/ 30</small></div></div></div>' +
        '<div class="estado">' + (S.nombre ? esc(S.nombre) + ' · ' : '') + 'Baremo de ' + (S.sexo === 'M' ? 'mujeres' : 'hombres') + ' · ' + esc(textoEstado(r, true)) + (r.objetivo ? ' · Objetivo ' + pts(r.objetivo.valor) + ' (' + (r.objetivo.diferencia >= 0 ? '+' : '−') + pts(Math.abs(r.objetivo.diferencia)) + ')' : '') + '</div>' +
        '<h2>Primer ejercicio: test</h2><table>' + fila('Test (mínimo 10)', esc(dTest), pts(r.bloques.test), '20') + '</table>' +
        '<h2>Segundo ejercicio: pruebas físicas</h2><table>' + fila('Suma de las seis pruebas', r.fisicas.directa ? 'Puntos escritos directamente' : r.fisicas.apto === false ? 'Hay una prueba por debajo de la marca mínima' : (r.fisicas.completas ? 'Seis pruebas' : r.fisicas.conMarca + ' de 6 pruebas'), r.fisicas.apto === false ? 'NO APTO' : pts(r.bloques.fisicas), '30') + fis +
        fila('Pruebas de tolerancia / Reconocimiento médico', apt[S.psico] + ' / ' + apt[S.medico], '—', '—', 'in') + fila('NOTA DE LA OPOSICIÓN ESTIMADA', '', pts(r.total), '50', 'tot') + '</table>' +
        tablaConvocatoriasInforme() +
        pieInforme('Simulación orientativa elaborada con el simulador de TÉCNIKA FIRE según las bases de las Órdenes 2780/2023 y 877/2026 de la Comunidad de Madrid (bombero/a especialista conductor): test de 0 a 20 con mínimo 10 y seis pruebas físicas con baremo continuo de 1,5 (2 en mujeres) a 5 puntos. No tiene validez oficial.');
    }
    function imprimirInforme() {
      var html = htmlInforme();
      try {
        var marco = document.createElement('iframe');
        marco.setAttribute('aria-hidden', 'true'); marco.setAttribute('title', 'Informe');
        marco.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden';
        document.body.appendChild(marco);
        var d = marco.contentWindow.document; d.open(); d.write(html); d.close();
        setTimeout(function () {
          try { marco.contentWindow.focus(); marco.contentWindow.print(); } catch (e) { abrirEnVentana(html); }
          setTimeout(function () { if (marco.parentNode) marco.parentNode.removeChild(marco); }, 60000);
        }, 350);
      } catch (e) { abrirEnVentana(html); }
    }
    function abrirEnVentana(html) {
      var w = null; try { w = window.open('', '_blank'); } catch (e) { w = null; }
      if (!w) { toast('Permite las ventanas emergentes para generar el informe'); return; }
      w.document.open(); w.document.write(html); w.document.close(); setTimeout(function () { try { w.focus(); w.print(); } catch (e) { /* el usuario puede imprimir a mano */ } }, 400);
    }

    /* ---------- Altura automática cuando va dentro de un iframe ---------- */
    var tAltura = null;
    function avisarAltura() {
      if (window.parent === window) return;
      clearTimeout(tAltura);
      tAltura = setTimeout(function () {
        try { window.parent.postMessage({ tkf: 'simulador', height: Math.ceil(app.getBoundingClientRect().height) }, '*'); } catch (e) { /* sin acceso al marco padre */ }
      }, 60);
    }
    if (window.ResizeObserver) new ResizeObserver(avisarAltura).observe(app);
    window.addEventListener('load', avisarAltura);

    /* ---------- Arranque ---------- */
    aplicarVista();
    mostrarEleccion(!S.ambito);
    commit(false);
    sincronizar();
    if (modoPrivado) {
      window.addEventListener('message', manejarHidratacion);
      enviarAlPadre('ready');
    }
    return { estado: function () { return S; }, resultado: function () { return R; }, resultadoMadrid: function () { return RM; }, irA: irA, elegirAmbito: function (a, t) { C.aplicarAmbito(S, a, t); aplicarVista(); mostrarEleccion(false); commit(false); sincronizar(); } };
  }

  function montarTodos() {
    Array.prototype.forEach.call(document.querySelectorAll('[data-tkf-simulador]'), function (host) {
      montar(host, { paginaCompleta: host.getAttribute('data-tkf-simulador') === 'pagina' });
    });
  }
  return { montar: montar, montarTodos: montarTodos };
})();

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', TKFApp.montarTodos); else TKFApp.montarTodos();

})();
</script>
