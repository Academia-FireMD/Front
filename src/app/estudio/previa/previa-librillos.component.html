<header class="cabecera">
  <div class="identidad">
    <a
      pButton
      class="p-button-text p-button-sm"
      routerLink="/app/documentacion/alumno"
      [queryParams]="{ tema: tema().id, doc: tema().documentoId }"
    >
      <i class="pi pi-arrow-left" aria-hidden="true"></i>
      <span>Volver al tema</span>
    </a>
    <h1>Librillo <span>Vista previa</span></h1>
  </div>

  <nav class="temas" aria-label="Tema de estudio">
    @for (opcion of temas; track opcion.id) {
      <a
        [routerLink]="[opcion.clave]"
        [attr.aria-current]="tema().id === opcion.id ? 'page' : null"
      >
        {{ opcion.titulo }}
      </a>
    }
  </nav>

  <div class="practica" aria-label="Práctica del tema en el campus">
    <a
      pButton
      class="p-button-sm p-button-outlined"
      routerLink="/app/test/alumno/realizar-test"
      [queryParams]="parametrosPractica(tema())"
    >
      <i class="pi pi-list" aria-hidden="true"></i>
      <span>Hacer test</span>
    </a>
    <a
      pButton
      class="p-button-sm"
      routerLink="/app/test/alumno/realizar-flash-cards-test"
      [queryParams]="parametrosPractica(tema())"
    >
      <i class="pi pi-clone" aria-hidden="true"></i>
      <span>Repasar flashcards</span>
    </a>
  </div>
</header>
<router-outlet />
