<div
  class="grid justify-content-between align-items-center text-center px-3 mt-1"
>
  <div class="flex justify-content-center gap-2">
    <p-button
      icon="pi pi-angle-left"
      [ariaLabel]="
        view === CalendarView.Month
          ? 'Mes anterior'
          : view === CalendarView.Day
            ? 'Día anterior'
            : 'Semana anterior'
      "
      [link]="true"
      [disabled]="isPreviousDisabled()"
      class="p-button-primary"
      (click)="changeViewDate('previous')"
    ></p-button>

    <p-button
      icon="pi pi-calendar"
      label="Hoy"
      [link]="true"
      class="p-button-secondary"
      (click)="setToday()"
    ></p-button>

    <p-button
      icon="pi pi-angle-right"
      [ariaLabel]="
        view === CalendarView.Month
          ? 'Mes siguiente'
          : view === CalendarView.Day
            ? 'Día siguiente'
            : 'Semana siguiente'
      "
      [link]="true"
      [disabled]="isNextDisabled()"
      class="p-button-primary"
      (click)="changeViewDate('next')"
    ></p-button>
  </div>
</div>
