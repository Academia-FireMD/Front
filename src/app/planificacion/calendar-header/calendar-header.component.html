<div class="calendar-nav" role="group" aria-label="Navegación del calendario">
  <div class="calendar-nav__buttons">
    <p-button
      icon="pi pi-angle-left"
      ariaLabel="Anterior"
      [link]="true"
      [disabled]="isPreviousDisabled()"
      class="p-button-primary"
      (click)="changeViewDate('previous')"
    ></p-button>

    <p-button
      icon="pi pi-calendar"
      label="Hoy"
      [link]="true"
      class="p-button-secondary"
      (click)="setToday()"
    ></p-button>

    <p-button
      icon="pi pi-angle-right"
      ariaLabel="Siguiente"
      [link]="true"
      [disabled]="isNextDisabled()"
      class="p-button-primary"
      (click)="changeViewDate('next')"
    ></p-button>
  </div>
</div>
