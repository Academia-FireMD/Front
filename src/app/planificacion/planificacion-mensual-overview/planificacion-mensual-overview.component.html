<p-confirmDialog></p-confirmDialog>

<app-generic-list
  [fetchItems$]="fetchItems$"
  [itemTemplate]="planificacionItemTemplate"
  [filters]="filters"
  [stackActionsOnMobile]="true"
  [autoItemHeight]="true"
  (onItemClick)="navigateToDetailview($any($event).id)"
  (filtersChanged)="onFiltersChanged($event)"
>
  <div left-actions>
    <p-iconField iconPosition="left">
      <p-inputIcon styleClass="pi pi-search"></p-inputIcon>
      <input
        type="search"
        pInputText
        class="w-full"
        name="buscar-planificacion-mensual"
        autocomplete="off"
        [readOnly]="searchReadOnly"
        (focus)="activarBusqueda($event)"
        aria-label="Buscar planificación"
        placeholder="Buscar planificación"
        [value]="pagination().searchTerm"
        (input)="valueChanged($event)"
      />
    </p-iconField>
  </div>

  <div right-actions>
    <div class="flex gap-2 monthly-actions">
      <p-button
        icon="pi pi-sync"
        [link]="true"
        (click)="refresh()"
        label="{{ viewportService.screenWidth == 'xs' ? '' : 'Refrescar' }}"
        pTooltip="Refrescar"
      ></p-button>
      <p-button
        *ngIf="expectedRole == 'ADMIN'"
        label="{{
          viewportService.screenWidth == 'xs'
            ? undefined
            : 'Crear plan personal'
        }}"
        ariaLabel="Crear plan personal"
        icon="pi pi-plus"
        pTooltip="Crear plan personal para un alumno"
        (click)="navigateToDetailview('new')"
      ></p-button>
      <p-button
        *ngIf="expectedRole == 'ADMIN'"
        label="{{
          viewportService.screenWidth == 'xs'
            ? undefined
            : 'Semanas: importar o publicar'
        }}"
        ariaLabel="Importar o publicar semanas"
        icon="pi pi-upload"
        [outlined]="true"
        pTooltip="Revisar, preparar o publicar semanas de planes automáticos"
        (click)="abrirImportacion()"
      ></p-button>
      <p-button
        *ngIf="expectedRole == 'ADMIN'"
        icon="pi pi-ellipsis-v"
        [text]="true"
        pTooltip="Más opciones"
        ariaLabel="Más opciones de planificación"
        (onClick)="opcionesPlanes.toggle($event)"
      ></p-button>
      <p-menu
        #opcionesPlanes
        [popup]="true"
        [model]="opcionesAvanzadas"
        appendTo="body"
      />
    </div>
  </div>

  <div empty-template>
    <div class="text-center p-4">
      No hay planificaciones mensuales disponibles
    </div>
  </div>
</app-generic-list>

<!-- Template para el item de planificación -->
<ng-template #planificacionItemTemplate let-item>
  <div
    class="flex w-full monthly-row"
    [ngClass]="
      viewportService.screenWidth === 'xs' ? 'flex-column' : 'flex-row'
    "
  >
    <div
      class="flex flex-column py-2 col-9 left-side truncate-flex-content monthly-row__main"
      [style.width]="viewportService.screenWidth === 'xs' ? '100%' : null"
      [style.flex]="viewportService.screenWidth === 'xs' ? '0 0 auto' : '1 1 0'"
    >
      <div
        class="text-lg font-medium flex flex-wrap gap-2 align-items-center monthly-row__top"
      >
        <div class="flex gap-1">
          <strong
            class="identifier"
            pTooltip="{{ item.identificador }}"
            tooltipPosition="top"
            >{{ item.identificador }}</strong
          >
        </div>
        <div class="flex flex-wrap gap-1 align-items-center monthly-row__chips">
          <p-chip
            *ngIf="expectedRole === 'ADMIN'"
            [label]="esAutomatica(item) ? 'Automática' : 'Personal'"
            [pTooltip]="
              esAutomatica(item)
                ? 'Se publica por perfil'
                : 'Se asigna a un alumno concreto'
            "
            tooltipPosition="top"
          />
          <p-chip
            *ngIf="item.estado"
            [label]="
              item.estado === 'BORRADOR'
                ? 'Borrador'
                : item.estado === 'PUBLICADA'
                  ? 'Publicada'
                  : 'Archivada'
            "
          />
          <p-chip
            label="{{ matchKeyWithLabel(item.tipoDePlanificacion) }}"
            pTooltip="Tipo de planificación: {{
              matchKeyWithLabel(item.tipoDePlanificacion)
            }}"
            tooltipPosition="top"
          />
          <p-chip
            *ngIf="item?.asignacion?.alumno"
            label="{{
              item.asignacion.alumno.nombre
                ? item.asignacion.alumno.nombre +
                  ' ' +
                  item.asignacion.alumno.apellidos
                : item.asignacion.alumno.email
            }}"
            pTooltip="Alumno asignado"
            tooltipPosition="top"
          />
        </div>
      </div>
      <span
        class="descripcion"
        pTooltip="{{ item.descripcion }}"
        tooltipPosition="top"
        >{{
          item.descripcion && item.descripcion.length > 0
            ? item.descripcion
            : "Sin descripción"
        }}</span
      >
    </div>
    <div
      class="right-side col-3 flex align-items-center justify-content-end monthly-row__side"
      [style.width]="viewportService.screenWidth === 'xs' ? '100%' : null"
      [style.flex]="
        viewportService.screenWidth === 'xs' ? '0 0 auto' : '0 0 25%'
      "
    >
      <div
        class="flex flex-row flex-wrap align-items-center justify-content-end gap-2 monthly-row__actions"
      >
        <app-oposicion-picker
          context="catalogo"
          *ngIf="item.relevancia?.length"
          [oposiciones]="item.relevancia"
          [allowAdd]="false"
        ></app-oposicion-picker>
        <span
          class="text-xs hidden md:block unbreakable-text"
          pTooltip="Fecha de creación: {{
            item.createdAt | date: 'dd/MM/yyyy HH:mm'
          }}"
          tooltipPosition="top"
        >
          {{ item.createdAt | date: "short" }}</span
        >
        <p-button
          *ngIf="expectedRole == 'ADMIN'"
          (click)="$event.stopPropagation()"
          (onClick)="crearCopiaManual(item.id)"
          icon="pi pi-user-plus"
          pTooltip="Crear una copia personal independiente"
          ariaLabel="Crear una copia personal independiente"
        ></p-button>
        <p-button
          *ngIf="expectedRole == 'ADMIN'"
          (click)="$event.stopPropagation()"
          (onClick)="eliminar(item.id, $event)"
          icon="pi pi-trash"
          pTooltip="Eliminar planificación"
          ariaLabel="Eliminar planificación"
          styleClass="p-button-danger"
        ></p-button>
        <p-button
          (click)="$event.stopPropagation()"
          (onClick)="navigateToDetailview(item.id)"
          icon="pi pi-pencil"
          pTooltip="Editar planificación"
          ariaLabel="Editar planificación"
        ></p-button>
      </div>
    </div>
  </div>
</ng-template>
