<ng-template #overflowTooltip>
  <div class="calendar-event-overflow-tooltip">
    <strong>{{ displayedTitle }}</strong>
    <p *ngIf="contextText?.trim()" class="event-context-text">
      {{ contextText }}
    </p>
    <markdown *ngIf="description?.trim()" [data]="description"></markdown>
  </div>
</ng-template>

<div
  #surface
  class="event-overflow-surface"
  [class.description-overflow]="descriptionIsTruncated"
  [class.description-hidden]="descriptionHidden"
  [pTooltip]="hasOverflow ? overflowTooltip : ''"
  tooltipStyleClass="event-overflow-tooltip-container"
  tooltipEvent="both"
  tooltipPosition="top"
  appendTo="body"
  showDelay="100"
  [autoHide]="false"
  [escape]="true"
  [hideOnEscape]="true"
  [attr.tabindex]="hasOverflow ? 0 : null"
  [attr.aria-label]="hasOverflow ? tooltipAccessibleText : null"
  [attr.data-overflow]="hasOverflow ? 'true' : 'false'"
  [attr.data-compact]="isCompact ? 'true' : 'false'"
  data-testid="event-overflow-surface"
>
  <ng-content></ng-content>
</div>
